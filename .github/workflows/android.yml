
name: APK Android GLUXO

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK GLUXO
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validar credenciais de assinatura
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${KS_B64:-}" || -z "${KS_ALIAS:-}" || -z "${KS_PASS:-}" ]]; then
            echo "::error::Credenciais de assinatura ausentes. APK nao sera gerado."
            exit 1
          fi

          echo "Credenciais obrigatorias encontradas."

      - name: Instalar dependencias
        run: npm install

      - name: Executar testes
        run: npm test

      - name: Preparar projeto Android
        run: npm run android:prepare

      - name: Compilar e assinar APK Release
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          (cd android && ./gradlew assembleRelease)

          APK_UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [[ ! -f "$APK_UNSIGNED" ]]; then
            echo "::error::APK Release nao encontrado."
            exit 1
          fi

          BT_DIR="$ANDROID_HOME/build-tools"
          BT_VERSION="$(ls "$BT_DIR" | sort -V | tail -n 1)"
          BT="$BT_DIR/$BT_VERSION"

          test -x "$BT/zipalign"
          test -x "$BT/apksigner"

          trap 'rm -f "$RUNNER_TEMP/gluxo-upload-key.jks" "$RUNNER_TEMP/gluxo-aligned.apk"' EXIT

          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/gluxo-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/gluxo-upload-key.jks"

          "$BT/zipalign" -f -p 4 \
            "$APK_UNSIGNED" \
            "$RUNNER_TEMP/gluxo-aligned.apk"

          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/gluxo-upload-key.jks" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS \
            --out "$GITHUB_WORKSPACE/GLUXO.apk" \
            "$RUNNER_TEMP/gluxo-aligned.apk"

          "$BT/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/GLUXO.apk"

          echo "APK GLUXO assinado e verificado com sucesso."

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GLUXO-apk
          path: GLUXO.apk
          if-no-files-found: error

      - name: Publicar na pagina de Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GLUXO.apk
